<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flaggle — Legal</title>
<style>
  :root { --bg:#0D1321; --card:#161E30; --fg:#E8EEF7; --muted:#9FB0C8; --brand:#22E3B8; --brand2:#2DD4FF; --border:#2A3856; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 20px 64px; }
  header { text-align:center; padding:48px 0 24px; }
  .logo { font-size:40px; font-weight:900; background:linear-gradient(90deg,var(--brand2),var(--brand)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { color:var(--muted); margin-top:4px; }
  .cards { display:grid; gap:16px; margin-top:28px; }
  a.card { display:block; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 22px; text-decoration:none; color:var(--fg); transition:border-color .15s; }
  a.card:hover { border-color:var(--brand); }
  a.card h2 { margin:0 0 4px; font-size:19px; }
  a.card p { margin:0; color:var(--muted); font-size:14px; }
  footer { text-align:center; color:var(--muted); font-size:13px; margin-top:40px; }
  footer a { color:var(--brand2); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">Flaggle 🏳️</div>
      <div class="tag">Legal &amp; privacy</div>
    </header>
    <div class="cards">
      <a class="card" href="privacy.html">
        <h2>Privacy Policy →</h2>
        <p>What data the app uses and how it's handled.</p>
      </a>
      <a class="card" href="terms.html">
        <h2>Terms of Use →</h2>
        <p>The rules for using Flaggle.</p>
      </a>
    </div>
    <footer>© 2026 Pairwise · Flaggle</footer>
  </div>
</body>
</html>
